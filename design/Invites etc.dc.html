<div style="max-width:1500px;margin:0 auto;padding:60px 40px 110px;">

  <!-- ============ INVITATIONS ============ -->
  <div style="text-align:center;margin:64px 0 34px;">
    <span style="font-family:'Jost';font-weight:400;letter-spacing:0.4em;text-transform:uppercase;font-size:12px;color:#527088;padding:7px 20px;border:1px solid #adc7d6;border-radius:100px;padding-left:calc(20px + 0.4em);">Inbjudan</span>

          <div style="font-family:'Cormorant Garamond';font-weight:300;font-size:32px;letter-spacing:0.06em;color:#476377;margin-top:16px;">14.08.2027</div>
          <div style="font-family:'Jost';font-weight:300;font-size:11px;letter-spacing:0.4em;text-transform:uppercase;color:#6a8296;margin-top:16px;padding-left:0.4em;">Nynäs Havsbad</div>
        </div>
      </div>
      </div>
      <figcaption style="text-align:center;margin-top:15px;font-family:'Jost';font-weight:300;letter-spacing:0.3em;text-transform:uppercase;font-size:12px;color:#6a8296;">2a · Bukett till höger</figcaption>
