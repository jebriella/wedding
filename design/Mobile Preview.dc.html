<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&amp;family=Jost:wght@300;400&amp;display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#cfdde8}</style>
</helmet>
<div style="padding:56px 40px 80px;">
  <div style="text-align:center;margin-bottom:40px;">
    <div style="font-family:'Jost';font-weight:300;letter-spacing:0.5em;text-transform:uppercase;font-size:12px;color:#527088;">Bröllopssajt · Mobil</div>
    <div style="font-family:'Cormorant Garamond';font-style:italic;font-weight:300;font-size:38px;color:#3c5670;margin-top:10px;">Gabriella <span style="color:#9773bf;">&amp;</span> Fredrik</div>
  </div>
  <div style="display:flex;gap:48px;justify-content:center;flex-wrap:wrap;align-items:flex-start;">
    <sc-for list="{{ phones }}" as="p" hint-placeholder-count="4">
      <figure style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <div style="width:390px;height:844px;border-radius:52px;padding:12px;background:#24384a;box-shadow:0 40px 80px -30px rgba(36,56,74,0.55);">
          <iframe src="{{ p.src }}" title="{{ p.label }}" style="width:366px;height:820px;border:none;border-radius:40px;background:#dde9f2;display:block;"></iframe>
        </div>
        <figcaption style="font-family:'Jost';font-weight:400;letter-spacing:0.3em;text-transform:uppercase;font-size:12px;color:#476377;">{{ p.label }}</figcaption>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const f = 'Wedding%20Website%20v2.dc.html';
    return { phones: [
      { label: 'Start', src: f },
      { label: 'Dagen', src: f + '#dagen' },
      { label: 'Boende', src: f + '#boende' },
      { label: 'O.S.A.', src: f + '#osa' }
    ] };
  }
}
</script>
</body>
</html>
